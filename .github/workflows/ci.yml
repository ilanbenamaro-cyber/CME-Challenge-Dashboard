name: ci
on:
  push:
    branches: [main, 'feat/**', 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run typecheck
      - run: npm run test:js
      - run: npm run test:py
